name: Android-app bouwen

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Webbestanden klaarzetten
        run: |
          rm -rf www && mkdir www
          cp -r index.html css js icons manifest.webmanifest www/

      - name: Capacitor installeren
        run: npm install --no-audit --no-fund

      - name: Android-project maken
        run: |
          npx cap add android
          npx cap sync android

      - name: App-icoon, versie en ondertekening
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-res/mipmap-$d/*.png "$RES/mipmap-$d/"
          done
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  vakantie {
                      storeFile file("../../android-res/vakantieplanner.jks")
                      storePassword "vakantie2026"
                      keyAlias "vakantieplanner"
                      keyPassword "vakantie2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.vakantie
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: APK bouwen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../vakantieplanner.apk

      - name: APK publiceren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Vakantieplanner 1.${{ github.run_number }}
          body: |
            Download **vakantieplanner.apk** hieronder en open het bestand op je Android-telefoon om te installeren of bij te werken.
          files: vakantieplanner.apk
          make_latest: true
